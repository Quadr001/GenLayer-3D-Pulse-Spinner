<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GenLayer Loading Spinner</title>
<style>
:root {
  --bg:#f5f4f8; --surface:rgba(255,255,255,.72);
  --border:rgba(20,20,30,.08); --mark:#111;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  overflow:hidden; background:
  radial-gradient(circle at 50% 42%,rgba(176,38,255,.10),transparent 25%),
  radial-gradient(circle at 30% 70%,rgba(0,217,255,.07),transparent 28%),var(--bg);
}
body:before{
  content:""; position:fixed; inset:-25%; pointer-events:none; opacity:.35;
  background:repeating-radial-gradient(ellipse at center,transparent 0 38px,
  rgba(110,95,140,.045) 39px 40px);
  transform:rotate(-8deg); animation:drift 18s linear infinite;
}
.spinner{
  width:96px;height:96px;position:relative;display:grid;place-items:center;
  perspective:700px;isolation:isolate;
}
.spinner:after{
  content:"";position:absolute;inset:8px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:0 18px 50px rgba(79,45,120,.16),inset 0 1px 0 #fff8;
  backdrop-filter:blur(12px);
}
.core{
  width:72px;height:72px;position:relative;z-index:2;
  transform-style:preserve-3d;
  animation:spin 1.8s cubic-bezier(.65,0,.35,1) infinite;
}
.glow{
  position:absolute;z-index:1;width:54px;height:54px;border-radius:50%;
  background:conic-gradient(from 0deg,#b026ff44,#725cff33,#00d9ff38,#b026ff44);
  filter:blur(12px);animation:pulse 1.8s ease-in-out infinite;
}
svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 5px 9px #50376e1f)}
@keyframes spin{
  0%{transform:rotateY(0) rotateZ(0) scale(1)}
  18%{transform:rotateY(55deg) rotateZ(2deg) scale(.94)}
  50%{transform:rotateY(180deg) rotateZ(0) scale(.88)}
  82%{transform:rotateY(305deg) rotateZ(-2deg) scale(.94)}
  100%{transform:rotateY(360deg) rotateZ(0) scale(1)}
}
@keyframes pulse{0%,100%{opacity:.38;transform:scale(.82)}50%{opacity:.9;transform:scale(1.12)}}
@keyframes drift{from{transform:rotate(-8deg) translate3d(0,0,0)}to{transform:rotate(-8deg) translate3d(2%,1%,0)}}
@media(prefers-color-scheme:dark){
  :root{--bg:#09090d;--surface:rgba(22,22,29,.72);--border:#fff2;--mark:#fff}
  body{background:radial-gradient(circle at 50% 42%,#b026ff26,transparent 26%),
  radial-gradient(circle at 70% 65%,#00d9ff14,transparent 30%),var(--bg)}
  body:before{opacity:.22}
  .spinner:after{box-shadow:0 18px 55px #0006,inset 0 1px 0 #fff1}
}
@media(prefers-reduced-motion:reduce){body:before,.core,.glow{animation:none}}
</style>
</head>
<body>
<div class="spinner" role="status" aria-label="Loading">
  <div class="glow"></div>
  <div class="core">
    <svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradient" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#b026ff"/>
          <stop offset="42%" stop-color="#6d5dfc"/>
          <stop offset="72%" stop-color="#00d9ff"/>
          <stop offset="100%" stop-color="#b026ff"/>
        </linearGradient>
        <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
      <path d="M128 17L190 52L231 181L169 143L151 154L128 224L105 154L87 143L25 181L66 52Z"
        fill="none" stroke="url(#gradient)" stroke-width="8" stroke-linejoin="round"
        opacity=".65" filter="url(#blur)"/>
      <path d="M128 17L190 52L231 181L169 143L151 154L128 224L105 154L87 143L25 181L66 52Z"
        fill="none" stroke="var(--mark)" stroke-width="10" stroke-linejoin="round"/>
      <path d="M128 47L163 68L181 128L145 106L128 92L111 106L75 128L93 68Z"
        fill="none" stroke="url(#gradient)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M128 105L147 139L128 150L109 139Z" fill="var(--mark)"/>
    </svg>
  </div>
</div>
</body>
</html>
