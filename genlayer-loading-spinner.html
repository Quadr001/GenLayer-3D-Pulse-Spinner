<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GenLayer Loading Spinner</title>

<style>
  :root {
    --glow-1: #b026ff;
    --glow-2: #6d5dfc;
    --glow-3: #00d9ff;
    --mark: #111111;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f7f7f5;
  }

  .genlayer-spinner {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    perspective: 500px;
  }

  .genlayer-spinner__core {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    animation: genlayer-spin 1.8s cubic-bezier(.65, 0, .35, 1) infinite;
  }

  .genlayer-spinner svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /*
   * Subtle animated glow.
   * This keeps the spinner recognizable even at small sizes.
   */
  .genlayer-spinner__glow {
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    background:
      radial-gradient(
        circle,
        rgba(176, 38, 255, .18),
        rgba(0, 217, 255, .08) 45%,
        transparent 72%
      );
    filter: blur(8px);
    animation: glow-pulse 1.8s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes genlayer-spin {
    0% {
      transform:
        rotateY(0deg)
        rotateZ(0deg)
        scale(1);
    }

    18% {
      transform:
        rotateY(55deg)
        rotateZ(2deg)
        scale(.94);
    }

    50% {
      transform:
        rotateY(180deg)
        rotateZ(0deg)
        scale(.88);
    }

    82% {
      transform:
        rotateY(305deg)
        rotateZ(-2deg)
        scale(.94);
    }

    100% {
      transform:
        rotateY(360deg)
        rotateZ(0deg)
        scale(1);
    }
  }

  @keyframes glow-pulse {
    0%, 100% {
      opacity: .45;
      transform: scale(.88);
    }

    50% {
      opacity: .9;
      transform: scale(1.08);
    }
  }

  /*
   * Dark-background mode.
   *
   * Add class="dark" to the parent/container.
   */
  .dark .genlayer-spinner {
    --mark: #ffffff;
  }

  .dark .genlayer-spinner__glow {
    background:
      radial-gradient(
        circle,
        rgba(176, 38, 255, .28),
        rgba(0, 217, 255, .12) 45%,
        transparent 72%
      );
  }

  @media (prefers-reduced-motion: reduce) {
    .genlayer-spinner__core,
    .genlayer-spinner__glow {
      animation: none;
    }

    .genlayer-spinner__core {
      transform: none;
    }
  }
</style>
</head>

<body>

<div class="genlayer-spinner" aria-label="Loading" role="status">

  <div class="genlayer-spinner__glow"></div>

  <div class="genlayer-spinner__core">

    <svg
      viewBox="0 0 256 256"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >

      <defs>

        <!-- GenLayer-inspired iridescent gradient -->
        <linearGradient
          id="genlayerGradient"
          x1="20%"
          y1="0%"
          x2="80%"
          y2="100%"
        >
          <stop offset="0%" stop-color="#b026ff"/>
          <stop offset="42%" stop-color="#7b61ff"/>
          <stop offset="72%" stop-color="#00cfff"/>
          <stop offset="100%" stop-color="#b026ff"/>
        </linearGradient>

        <filter id="softGlow">
          <feGaussianBlur
            stdDeviation="3"
            result="blur"
          />
        </filter>

      </defs>

      <!-- Soft colored silhouette -->
      <path
        d="
          M128 17
          L190 52
          L231 181
          L169 143
          L151 154
          L128 224
          L105 154
          L87 143
          L25 181
          L66 52
          Z
        "
        fill="none"
        stroke="url(#genlayerGradient)"
        stroke-width="8"
        stroke-linejoin="round"
        opacity=".65"
        filter="url(#softGlow)"
      />

      <!-- Main GenLayer mark -->
      <path
        d="
          M128 17
          L190 52
          L231 181
          L169 143
          L151 154
          L128 224
          L105 154
          L87 143
          L25 181
          L66 52
          Z
        "
        fill="none"
        stroke="var(--mark)"
        stroke-width="10"
        stroke-linejoin="round"
      />

      <!-- Inner negative-space structure -->
      <path
        d="
          M128 47
          L163 68
          L181 128
          L145 106
          L128 92
          L111 106
          L75 128
          L93 68
          Z
        "
        fill="none"
        stroke="url(#genlayerGradient)"
        stroke-width="7"
        stroke-linejoin="round"
      />

      <!-- Central GenLayer diamond -->
      <path
        d="
          M128 105
          L147 139
          L128 150
          L109 139
          Z
        "
        fill="var(--mark)"
      />

    </svg>

  </div>
</div>

</body>
</html>
